packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  esbuild: true
  prisma: true
  unrs-resolver: true
  # 纯 JS 工具库（间接依赖），postinstall 仅打印消息、无构建需求：显式拒绝，pnpm 不再报 ERR_PNPM_IGNORED_BUILDS
  'es5-ext': false
