user nginx;
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  server_tokens off;

  # GEO 项目 SSG 静态产物：按站点目录分发
  # 访问方式：站点域名指向本服务，按 server_name 映射到 sites/<目录>/ 
  server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/sites;
    index index.html;

    # 站点沉淀静态资源（上传文件）
    location /static/ {
      alias /usr/share/nginx/uploads/;
      expires 7d;
      access_log on;
    }

    # 默认回落到 default 站点目录
    location / {
      try_files $uri $uri/ $uri/index.html /index.html =404;
    }
  }

  # 示例：为 site-a 配置独立域名
  # server {
  #   listen 80;
  #   server_name www.example.com;
  #   root /usr/share/nginx/sites/site-a;
  #   index index.html;
  #   location / { try_files $uri $uri/ $uri/index.html =404; }
  # }
}
